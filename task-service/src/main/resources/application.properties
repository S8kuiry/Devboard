spring.datasource.driver-class-name=org.postgresql.Driver

# --- HikariCP pool (kept identical to auth-service) ----
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.leak-detection-threshold=20000

# JPA / Hibernate Configuration
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Keep web server available when DB is offline
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

spring.jpa.open-in-view=false

server.port=${PORT:8081}

# Services & Frontend URLs
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8000}
app.frontend.url=${FRONTEND_URL:https://devboard-swart.vercel.app}

# ===================================================================
# Free Gmail SMTP Configuration (Works for both Local & Production)
# ===================================================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}

# Replace with your Gmail email address
spring.mail.username=${SPRING_MAIL_USERNAME:devboardorg@gmail.com}

# Paste your generated 16-character Google App Password here (WITHOUT SPACES)
spring.mail.password=${SPRING_MAIL_PASSWORD:tteqqrgjyqdzojrk}

# Must match spring.mail.username when using Gmail SMTP
app.mail.from-email=${APP_MAIL_FROM_EMAIL:devboardorg@gmail.com}

# Standard SMTP Protocol Properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Connection Timeouts
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Pool that runs @Async email dispatch off the request thread
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=devboard-mail-