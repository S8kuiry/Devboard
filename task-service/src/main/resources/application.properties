# --- HikariCP pool (kept identical to auth-service; see the notes there) ----
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.leak-detection-threshold=20000

# JPA / Hibernate Configuration
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Keep the web server available when the external database cannot be reached.
# Schema changes are managed outside this service, so Hibernate must neither inspect
# JDBC metadata nor run DDL while the application starts. Repository calls will still
# use the configured datasource and return an error if the database remains offline.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false

spring.jpa.open-in-view=false

server.port=${PORT:8081}
# Consumed by the AuthClient Feign interface. Override with the AUTH_SERVICE_URL
# environment variable in deployed environments; the default is for local dev.
auth.service.url=${AUTH_SERVICE_URL:http://localhost:8080}

# mail-configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=devboardworkspace@gmail.com

# Use an App Password if using Gmail, not your actual account password
spring.mail.password=lloe qyki ztuc ypgn
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Don't let a hung SMTP handshake pin a request thread for minutes.
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Pool that runs @Async email dispatch off the request thread.
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=8
spring.task.execution.pool.queue-capacity=100
spring.task.execution.thread-name-prefix=devboard-mail-
