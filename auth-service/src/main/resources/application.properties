spring.application.name=auth-service

# Database Credentials (Separated for HikariCP)
# connectTimeout/socketTimeout are seconds and are the JDBC-level guards; they must be
# comfortably under the Hikari connection-timeout below or Hikari gives up first.
spring.datasource.url=jdbc:postgresql://ep-restless-brook-az7wz3j1-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require&connectTimeout=20&socketTimeout=60&tcpKeepAlive=true
spring.datasource.username=neondb_owner
spring.datasource.password=npg_I3eGtcuQHrM9
spring.datasource.driver-class-name=org.postgresql.Driver

# --- HikariCP pool ---------------------------------------------------------
# The browser fires several requests at once (emails + tasks + assignee lookups),
# so the pool must be able to hand out more than one connection. Postman only ever
# issues one request at a time, which is why it never hit this.
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Neon is serverless: a cold compute can take well over 5s to accept a TLS connection.
# The old 5000ms meant the pool could never grow past the one connection it happened
# to have, and every concurrent request died with
# "Connection is not available ... (total=1, active=1, idle=0)".
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000

# Neon's pooler drops idle connections; recycle ours before it does so we never hand
# out a socket the server has already closed.
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.max-lifetime=300000

# -1 = never block or fail startup on an unreachable DB (the previous file set this
# twice, and the winning value of 0 meant "fail fast at startup").
spring.datasource.hikari.initialization-fail-timeout=-1

# Logs a stack trace for any connection held longer than 20s, so a future leak names
# the culprit instead of showing up as a pool timeout somewhere else.
spring.datasource.hikari.leak-detection-threshold=20000

# JPA / Hibernate Configuration
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Schema is managed manually; Hibernate must not run DDL on startup.
spring.jpa.hibernate.ddl-auto=none

# Release the JDBC connection at the end of the transaction rather than holding it
# for the whole request (view rendering, JSON serialization, etc).
spring.jpa.open-in-view=false

server.port=8080
