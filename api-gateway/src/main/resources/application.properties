spring.application.name=api-gateway
server.port=8060

# Downstream service locations. Override per environment with the AUTH_SERVICE_URL /
# TASK_SERVICE_URL environment variables; the values after ':' are the local dev defaults.
auth.service.url=${AUTH_SERVICE_URL:https://devboard-4dhu.onrender.com}
task.service.url=${TASK_SERVICE_URL:https://devboard-task-service.onrender.com}

# Auth Service Route
spring.cloud.gateway.server.webmvc.routes[0].id=auth-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${auth.service.url}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/auth/**

# Task Service - Tasks Route
spring.cloud.gateway.server.webmvc.routes[1].id=task-service-tasks
spring.cloud.gateway.server.webmvc.routes[1].uri=${task.service.url}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/tasks/**

# Task Service - Plans Route
spring.cloud.gateway.server.webmvc.routes[2].id=task-service-plans
spring.cloud.gateway.server.webmvc.routes[2].uri=${task.service.url}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/plans/**